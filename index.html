<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I'm So Sorry, My Love ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Floating Hearts Background Container -->
  <div class="hearts-container" id="heartsContainer"></div>

  <!-- Main Card -->
  <div class="card">
    <div class="header">
      <span class="emoji">🥺</span>
      <h1>I'm Really Sorry, Dear</h1>
    </div>
    
    <p class="message">
      I hate when things aren't right between us. You mean the world to me, and I promise to make it up to you! Will you forgive me?
    </p>

    <div class="buttons">
      <button id="yesBtn" class="btn yes-btn">Forgive Me 💕</button>
      <button id="noBtn" class="btn no-btn">Still Mad 😤</button>
    </div>

    <!-- Success Message Container -->
    <div id="successMessage" class="hidden">
      <span class="big-emoji">💖✨</span>
      <h2>Yay! Thank you, my love!</h2>
      <p>I promise to give you the biggest hug when I see you next!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
